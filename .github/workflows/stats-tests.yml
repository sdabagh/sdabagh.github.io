name: Stats Without Walls tests
on:
  pull_request:
    paths: ["stats/**", "accessibility.js", ".github/workflows/stats-tests.yml"]
  push:
    branches: [main]
    paths: ["stats/**", "accessibility.js", ".github/workflows/stats-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: stats/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Engine checks and browser suites
        working-directory: stats/tests
        run: bash run.sh
