name: Stats Without Walls tests
on:
  pull_request:
    paths: ["stats/**", "accessibility.js", ".github/workflows/stats-tests.yml"]
  push:
    branches: [main]
    paths: ["stats/**", "accessibility.js", ".github/workflows/stats-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: stats/tests
        run: |
          npm install --no-audit --no-fund
          # --with-deps also apt-installs fonts; when the runner cannot reach the Ubuntu mirror (it happened on
          # November 11), fall back to the browser alone: the shared libraries Chromium needs are on the image already.
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Engine checks and browser suites
        working-directory: stats/tests
        run: bash run.sh
